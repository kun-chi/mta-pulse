name: Collect MTA data

on:
  schedule:
    # Every 15 minutes (GitHub may delay runs by a few minutes - that's normal)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write         # allow the workflow to commit data back to the repo

concurrency:
  group: collect          # never run two collections at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python collect_mta.py

      - name: Commit new data
        run: |
          git config user.name "mta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
